{% extends "base.html" %}

{% block title %}
Clientes
{% endblock %}

{% block content %}

<h2 class="text-primary mb-4">
    Clientes
</h2>

<div class="table-responsive">

<table class="table table-striped table-bordered">

<thead class="table-dark">

<tr>

    <th>Nombre</th>
    <th>Correo</th>
    <th>Teléfono</th>

</tr>

</thead>

<tbody>

{% for cliente in clientes %}

<tr>

    <td>
        {{ cliente.nombre }}
    </td>

    <td>
        {{ cliente.correo }}
    </td>

    <td>
        {{ cliente.telefono }}
    </td>

</tr>

{% endfor %}

</tbody>

</table>

</div>

{% endblock %}
